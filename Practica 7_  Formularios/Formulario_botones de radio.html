<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Radiobotón</title>
</head>
<body>
    <h1>Formularios con Radiobotón</h1>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Selecciona el máximo de estudios que tienes:
        <br>
        <!-- Botones de opción única en los que el atributo name agrupa las opciones -->
        <input type="radio" name="estudios" value="1"> Sin estudios <br>
        <input type="radio" name="estudios" value="2"> Primaria <br>
        <input type="radio" name="estudios" value="3"> Secundaria <br>
        <input type="radio" name="estudios" value="4"> Preparatoria <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
