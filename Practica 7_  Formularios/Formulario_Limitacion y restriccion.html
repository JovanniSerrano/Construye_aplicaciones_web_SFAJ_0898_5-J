<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
</head>
<body>
    <h1>Formulario con Limitaciones</h1>
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Atributo 'disabled' deshabilita el campo para evitar interacción o envío -->
        <input type="text" name="nombre" disabled><br>
        
        Contraseña:
        <!-- Atributo 'maxlength' limita la cantidad máxima de caracteres ingresables -->
        <input type="password" name="pass" maxlength="5"><br>
        
        Comentarios:
        <!-- Atributo 'readonly' permite ver el contenido sin permitir su edición -->
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>
</body>
</html>
