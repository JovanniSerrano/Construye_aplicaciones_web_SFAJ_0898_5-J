<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para Contraseñas</title>
</head>
<body>
    <h1>Formulario para Contraseñas</h1>
    <!-- Formulario con método POST -->
    <form action="" method="post">
        Ingresa tu usuario:
        <!-- Campo de entrada para el usuario -->
        <input type="text" name="usuario">
        <br>
        Ingresa tu contraseña:
        <!-- Campo de contraseña que enmascara los caracteres ingresados -->
        <input type="password" name="pass">
        <br>
        <!-- Botón para enviar datos -->
        <input type="submit" value="enviar">
        <!-- Botón para limpiar los campos del formulario -->
        <input type="reset" value="borrar">
    </form>
</body>
</html>
