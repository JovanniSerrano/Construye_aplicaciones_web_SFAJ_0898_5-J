<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Textarea</title>
</head>
<body>
    <h1>Formulario con Text Area</h1>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Ingresa tu correo:
        <!-- Campo para direcciones de correo electrónico -->
        <input type="email" name="correo">
        <br>
        Ingresa tus comentarios:
        <br>
        <!-- Área de texto multilínea con número de filas y columnas definidas -->
        <textarea name="comentarios" rows="4" cols="30"></textarea>
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
