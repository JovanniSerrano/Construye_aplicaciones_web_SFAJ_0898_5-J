<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Campos Ocultos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h1>Formulario con Campos Ocultos</h1>
    <form action="" method="post">
        <!-- Campo oculto para enviar información invisible al usuario -->
        <input type="hidden" name="hora" value="3:30">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa-solid fa-trash"></i></button>
    </form>
</body>
</html>
