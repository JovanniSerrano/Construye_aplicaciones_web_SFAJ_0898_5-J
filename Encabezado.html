<!DOCTYPE html> <!--Indicamos que es un documento html -->
<html lang="es"> <!--Indicamos que se usara el idioma español para que no ocurran problemas por la lectura del documento-->

<head> <!--usamos la etiqueta de encabezado -->
  <meta chaset="UFT-8"> <!-- hacemos que el navegador interprete bien los caracteres epeciales -->
  <meta name="viewport" content="Width=device-width, initial-scale=1.0"> <!--establecemos el area visible de la pagina e ingresamos el zoom al ingresar a la pagina-->
  <title>Encabezado HTML</title> <!--Ingresamos la etiqueta de titulo e ingresamos el titulo de la pagina -->
</head> <!-- Cerramos la etuiqueta de encabezado -->

<body> <!-- ponemos la etiqueta para inciar el cuerpo del documento -->
  <h1>Titulo 1</h1> <!-- Utilizamos la etiqueta H1 para poner el subtitulo principal o más importante -->
  <h2>Titulo 2</h2> <!-- Utilizamos la etiqueta H2 Para poner el subtitulo que es menos importante que el principal -->
  <h3>Titulo 3</h3> <!-- Utilizamos la etiqueta H3 para poner el subtitulo que es poco menos importante -->
  <h4>Titulo 4</h4> <!-- Utilizamos la etiqueta H4 para poner el subtitulo que es poco importante -->
  <h5>Titulo 5</h5> <!-- Utilizamos la etiqueta H5 para poner el subtitulo que es no es importante --> 
  <h6>Titulo 6</h6> <!-- Utilizamos la etiqueta H6 para poner un subtitulo que no es para nada importante -->
</body> <!-- Cerramos el cuerpo utilizando la etiqueta </body> -->

</html> <!-- Cerramos el documento HTMl -->
