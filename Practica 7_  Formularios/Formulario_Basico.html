<!-- Define el tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Idioma del documento -->
<html lang="es">
<head>
    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">
    <!-- Ajuste para diseño responsivo en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la página -->
    <title>Formulario Básico</title>
</head>
<body>
    <!-- Encabezado principal de nivel 1 -->
    <h1>Ejemplo Básico</h1>
    <!-- Formulario para recolectar datos -->
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Campo de texto básico con un tamaño visible especificado -->
        <input type="text" name="nombre" size="20">
        <!-- Salto de línea -->
        <br>
        <!-- Botón para enviar el formulario -->
        <input type="submit" value="enviar">
    </form>
</body>
</html>
